[package]
name = "bad_apple_screensaver"
version = "1.0.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Bad Apple!! Windows 11 Screensaver in Rust with blurred transparent background"
build = "build.rs"

[[bin]]
name = "BadAppleScreenSaver-rs"
path = "src/main.rs"

[dependencies]
eframe = "0.29"
rfd = "0.15"
rodio = { version = "0.20", features = ["symphonia-mp3", "symphonia-vorbis", "symphonia-wav"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dependencies.windows]
version = "0.58"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
]

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
